# Backend unit tests (tests/unit/run.sh: no Docker, seconds) on every PR that touches backend code, so a change to
# rounds.py or store.py is tested before merge. The API and e2e suites stay in full.yml (label "full-suite").
name: Backend
on:
  pull_request:
    paths: ["backend/**", "tools/**", "tests/unit/**", "tests/sets/**", ".github/workflows/backend.yml"]
  push:
    branches: [main]
    paths: ["backend/**", "tools/**", "tests/unit/**", "tests/sets/**", ".github/workflows/backend.yml"]
  workflow_dispatch:
concurrency: {group: "backend-${{ github.ref }}", cancel-in-progress: true}
permissions: {contents: read}

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.15", cache: pip, cache-dependency-path: backend/requirements.txt}
      - run: pip install -r backend/requirements.txt
      - run: tests/unit/run.sh
