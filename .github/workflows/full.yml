# The full acceptance run (tests/run_all.sh: set gates, API tests, Playwright e2e) on a throwaway stack. Not on every PR:
# on a merge to main that touches app code, on demand, or on a PR labelled "full-suite" (add the label to run it).
name: Full suite
on:
  push:
    branches: [main]
    paths: ["backend/**", "deploy/**", "ui/**", "tests/*.py", "tests/*.sh", "tests/*.mjs", "tests/*.yml", "tests/sets/**", "tools/pack.py"]
  pull_request: {types: [labeled]}
  workflow_dispatch:
concurrency: {group: "full-${{ github.ref }}", cancel-in-progress: true}
permissions: {contents: read}

jobs:
  acceptance:
    if: github.event_name != 'pull_request' || github.event.label.name == 'full-suite'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: {suite: [api, e2e]}   # gates + API tests, and Playwright e2e, in parallel, each on its own throwaway stack
    steps:
      - uses: actions/checkout@v7
      - name: Run the backend as this runner's user (it writes the test data folder)
        run: echo "ILAB_UID=$(id -u)" >> "$GITHUB_ENV" && echo "ILAB_GID=$(id -g)" >> "$GITHUB_ENV"
      - name: Pull the pinned runner images (same list as deploy/install.sh)
        run: sed -n 's/.*os\.environ\.get("ILAB_IMG_[A-Z]*", *"\([^"]*\)").*/\1/p' backend/sandbox/runner.py | sort -u | grep -v '^ilab-' | xargs -n1 docker pull -q
      - name: ${{ matrix.suite == 'api' && 'Gates and API tests' || 'Playwright e2e' }}
        run: ILAB_SUITE=${{ matrix.suite }} tests/run_all.sh
      - name: Screenshots
        if: always() && matrix.suite == 'e2e'
        uses: actions/upload-artifact@v7
        with: {name: e2e-screenshots, path: tests/out/*.png, if-no-files-found: ignore}
