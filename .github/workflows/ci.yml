# Every push to main and every PR: build the UI, then the full acceptance run (tests/run_all.sh) on a throwaway stack.
name: CI
on:
  push: {branches: [main]}
  pull_request:
  workflow_dispatch:
concurrency: {group: "ci-${{ github.ref }}", cancel-in-progress: true}
permissions: {contents: read}

jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: {run: {working-directory: ui}}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: {node-version: 24, cache: npm, cache-dependency-path: ui/package-lock.json}
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node src/lib/panes.test.mjs

  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Run the backend as this runner's user (it writes the test data folder)
        run: echo "ILAB_UID=$(id -u)" >> "$GITHUB_ENV" && echo "ILAB_GID=$(id -g)" >> "$GITHUB_ENV"
      - name: Pull the pinned runner images (same list as deploy/install.sh)
        run: sed -n 's/.*os\.environ\.get("ILAB_IMG_[A-Z]*", *"\([^"]*\)").*/\1/p' backend/sandbox/runner.py | sort -u | grep -v '^ilab-' | xargs -n1 docker pull -q
      - name: Gates, API tests and Playwright e2e
        run: tests/run_all.sh
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with: {name: e2e-screenshots, path: tests/out/*.png, if-no-files-found: ignore}
