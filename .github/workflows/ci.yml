# UI build and the pane-size unit test, only when the UI changes.
name: UI
on:
  pull_request: {paths: ["ui/**"]}
  push: {branches: [main], paths: ["ui/**"]}
  workflow_dispatch:
concurrency: {group: "ui-${{ github.ref }}", cancel-in-progress: true}
permissions: {contents: read}

jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: {run: {working-directory: ui}}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: {node-version: 24, cache: npm, cache-dependency-path: ui/package-lock.json}
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node src/lib/panes.test.mjs
