<!doctype html>
<html>
<head><meta charset="utf-8"><style>
html,body{margin:0;height:auto;display:block;background:var(--bg)}
.cover{position:relative;width:960px;height:288px;overflow:hidden;background:var(--bg)}
.cover svg{position:absolute;left:480px;top:0}
.ink{fill:var(--inverse-bg)}.blue{fill:var(--accent)}.yel{fill:var(--timer-low-bg)}.red{fill:var(--fail)}.dot{fill:var(--inverse-fg)}
.r{rx:var(--r-lg);ry:var(--r-lg)}
.cover-name{position:absolute;left:32px;bottom:64px;margin:0;font:400 80px/.95 var(--font-sans);letter-spacing:-.045em;color:var(--fg);max-width:440px}
.cover-tagline{position:absolute;left:32px;bottom:32px;margin:0;font:400 14px/1.4 var(--font-sans);color:var(--fg-2);max-width:440px}
</style></head>
<body>
<div class="cover">
<svg width="480" height="288" viewBox="0 0 480 288" aria-hidden="true">
<!-- blocks: inverse-bg slab 200x256 (s-8 multiples, bleeds off the top), accent 112x136 (bleeds right), timer-low-bg 112x64, fail 48x32 (small: a state colour)
     arrangement: the round screen abstracted: a tall editor slab, Submit beside it, the 5-minute clock and a failing line below
     pattern: precise, technical, mono, a 4px grid -> a dot grid at s-5 (24px) cut into the slab, 6 x 9 = 54 dots
     scales: pitch s-5, gaps s-4 (16px) and s-5, corners r-lg (8px) -->
